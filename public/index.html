<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builder</title>
<link rel="stylesheet" href="/theme.css">
<style>
body{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);font-size:14px}
header b{color:var(--text);font-size:18px}
h2{margin:0;font-size:22px;text-wrap:balance}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface-0);border:1px solid var(--surface-1);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer;width:100%}
.item:hover{border-color:var(--accent)}
.pill{align-self:flex-start;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text)}
.pill.blocked{background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--warning)}
.empty{color:var(--text-muted);text-align:center;padding:40px 0}
.back{background:none;border:0;color:var(--accent-text);font:inherit;padding:0;cursor:pointer;align-self:flex-start}
pre{background:var(--bg-crust);border:1px solid var(--surface-1);border-radius:var(--radius);padding:10px;font:12px/1.4 var(--font-mono);white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;margin:0}
textarea{width:100%;box-sizing:border-box;min-height:80px;background:var(--bg-mantle);color:var(--text);border:1px solid var(--surface-1);border-radius:var(--radius);padding:10px;font:inherit}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:99px;padding:13px 0;font:600 15px var(--font);cursor:pointer}
.btn.yes{background:var(--accent);color:var(--on-accent)} .btn.yes:hover{background:var(--accent-hover)}
.btn.no{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.btn.ghost{background:var(--surface-0);color:var(--text);border:1px solid var(--surface-1)}
.btn:disabled{opacity:.5}
.card{position:relative;border:1px solid var(--surface-1);border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none;transition:transform .2s;background:var(--bg-mantle)}
.card iframe{display:block;width:100%;height:60vh;border:0;background:#fff;pointer-events:none}
.card img,.shot img{display:block;width:100%}
.stamp{position:absolute;top:12px;padding:3px 10px;border-radius:8px;font-weight:700;background:var(--bg-crust)}
.stamp.y{left:12px;color:var(--success);border:2px solid var(--success)} .stamp.n{right:12px;color:var(--danger);border:2px solid var(--danger)}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-1)}.dots i.on{outline:2px solid var(--accent)}
.dots i.k{background:var(--success)}.dots i.s{background:var(--danger)}
.shot{border:1px solid var(--surface-1);border-radius:12px;overflow:hidden}
.comments{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--surface-1);padding-top:12px}
.c{font-size:14px}.c b{color:var(--accent-text)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-0);border:1px solid var(--surface-1);padding:10px 16px;border-radius:99px;max-width:90vw}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--surface-1);background:var(--surface-0);color:var(--text);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;padding:0;background:var(--surface-0);border:2px solid var(--surface-1);border-radius:10px;overflow:hidden;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.tile.on{border-color:var(--accent)}.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg-crust)}
.tile b,.tile small{padding:0 6px;font-size:12px}.tile small{color:var(--text-muted);padding-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{position:absolute;top:4px;left:4px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:700 13px/22px var(--font);text-align:center}
.dur{position:absolute;top:4px;right:4px;font-size:11px;padding:1px 5px;border-radius:6px;background:var(--bg-crust);color:var(--text)}
.btn.sm{flex:none;padding:8px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main id="app"><p class="empty">Loading…</p></main>
<div class="toast" id="toast" hidden></div>
<script>
const app = document.getElementById('app');
let data = null, view = null, timer = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const owner = () => data?.me.role === 'owner';
const fileUrl = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 3500); }
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
async function load() {
  try {
    const r = await fetch('/api/inbox'); data = await r.json();
    if (!r.ok) { app.innerHTML = `<p class="empty">${esc(data.error)}</p>`; return; }
  } catch { return; }
  if (!view) list();
}

function list() {
  view = null;
  const card = it => { const i = data.items.indexOf(it); return `<button class="item" onclick="open_(${i})">
    <span class="pill ${it.status === 'blocked' ? 'blocked' : ''}">${it.type === 'pick' ? `${it.options?.length || 0} designs` : it.type === 'media' ? `${it.items?.length || 0} shots` : it.type === 'review' ? 'review' : { blocked: 'needs an answer', done: 'finished', idle: 'idle', working: 'working…' }[it.status] || it.status}</span>
    <b>${esc(it.project ? it.project + ' · ' : '')}${esc(it.title)}</b>
    <span class="label">${it.type === 'agent' ? esc(it.pane) : it.type === 'pick' ? 'pick what you like' : it.type === 'media' ? 'shots wählen' : esc(it.tldr || 'check the real version')}${it.comments.length ? ` · ${it.comments.length} comments` : ''}</span></button>`; };
  const waiting = data.items.filter(it => it.waiting), rest = data.items.filter(it => !it.waiting);
  app.innerHTML = `<header><b>Builder</b><span>${esc(data.me.name)} · ${data.me.role}</span></header>
  <h2>Waiting for you${waiting.length ? ` (${waiting.length})` : ''}</h2>
  ${waiting.length ? `<div class="list">${waiting.map(card).join('')}</div>` : `<p class="empty">Nothing is waiting on you.</p>`}
  ${rest.length ? `<details><summary class="label">All sessions (${rest.length})</summary><div class="list">${rest.map(card).join('')}</div></details>` : ''}
  ${data.recent.length ? `<p class="label">Recently answered</p><div class="list">${data.recent.map(r => `<div class="item" style="cursor:default"><b>${esc(r.title)}</b><span class="label">${esc(r.answer.text)}</span></div>`).join('')}</div>` : ''}`;
}
async function dismiss(it) {
  if (!confirm(`Delete "${it.title}"? It leaves your inbox and the agent is told it's not needed.`)) return;
  try { await post('/api/dismiss', { request: it.id.slice(4) }); toast('Deleted'); view = null; await load(); } catch (e) { toast(e.message); }
}
function open_(i) {
  const it = data.items[i]; view = it;
  if (it.type === 'pick') return pick(it, 0, it.options.map(() => null), it.options.map(() => ''));
  if (it.type === 'review') return review(it);
  if (it.type === 'media') return media(it);
  agent(it);
}
const head = (it, right = '') => `<header><button class="back" onclick="list()">← Inbox</button><span>${right}${owner() && it.id?.startsWith('req:') ? ` <button class="btn no sm" style="margin-left:8px" onclick="dismiss(view)">Delete</button>` : ''}</span></header><h2>${esc(it.title)}</h2>`;
const commentBox = it => `<div class="comments"><span class="label">Comments</span>
  ${it.comments.map(c => `<div class="c"><b>${esc(c.by)}</b> ${esc(c.text)}</div>`).join('') || '<span class="c" style="color:var(--text-muted)">None yet.</span>'}
  <textarea id="cm" placeholder="Add a comment for everyone" aria-label="Comment"></textarea>
  <button class="btn ghost" onclick="comment('${esc(it.id)}')">Comment</button></div>`;
async function comment(id) {
  const text = document.getElementById('cm').value;
  try { await post('/api/comment', { item: id, text }); toast('Comment added'); view = null; await load(); } catch (e) { toast(e.message); }
}
async function answer(body, okMsg) {
  try { await post('/api/answer', body); toast(okMsg); view = null; await load(); } catch (e) { toast(e.message); }
}

function agent(it) {
  app.innerHTML = `${head(it, esc(it.project))}
  <span class="label">${esc(it.pane)} · ${esc(it.status)}</span>
  <pre id="tail">${esc(it.tail)}</pre>
  ${owner() && it.status !== 'working' ? `<label class="label" for="ans">Your message (goes straight into that agent)</label><textarea id="ans"></textarea>
  <button class="btn yes" onclick="answer({pane:'${esc(it.pane)}',terminal_id:'${esc(it.terminal_id)}',seq:${+it.seq},text:document.getElementById('ans').value},'Sent to ${esc(it.pane)}')">Send</button>` : ''}
  ${commentBox(it)}`;
  const t = document.getElementById('tail'); t.scrollTop = t.scrollHeight;
}

function pick(it, i, verdicts, notes) {
  const o = it.options[i];
  const media = o.html ? `<iframe src="${fileUrl(o.html)}" title="${esc(o.label)}" sandbox></iframe>` : o.image ? `<img src="${fileUrl(o.image)}" alt="${esc(o.label)}">` : `<pre>${esc(o.text)}</pre>`;
  app.innerHTML = `${head(it, `${i + 1} / ${it.options.length}`)}
  <span class="label">${esc(o.label)}${o.note ? ' · ' + esc(o.note) : ''}</span>
  <div class="card" id="card"><span class="stamp y" ${verdicts[i] === true ? '' : 'hidden'}>KEEP</span><span class="stamp n" ${verdicts[i] === false ? '' : 'hidden'}>SKIP</span>${media}</div>
  <div class="dots">${it.options.map((_, j) => `<i class="${j === i ? 'on ' : ''}${verdicts[j] === true ? 'k' : verdicts[j] === false ? 's' : ''}"></i>`).join('')}</div>
  ${owner() ? `<label class="label" for="nt">What to change in ${esc(o.label)}</label><textarea id="nt">${esc(notes[i])}</textarea>
  <div class="row"><button class="btn no" id="skip">Skip</button><button class="btn yes" id="keep">Keep</button></div>
  <p class="label" style="text-align:center;margin:0">swipe right to keep · left to skip</p>` : ''}
  <div class="row"><button class="btn ghost" id="prev" ${i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${i < it.options.length - 1 ? '' : 'disabled'}>Next →</button></div>
  ${commentBox(it)}`;
  const go = j => { if (owner()) notes[i] = document.getElementById('nt').value; pick(it, j, verdicts, notes); };
  document.getElementById('prev').onclick = () => go(i - 1);
  document.getElementById('next').onclick = () => go(i + 1);
  if (!owner()) return;
  const vote = v => {
    notes[i] = document.getElementById('nt').value; verdicts[i] = v;
    const next = verdicts.findIndex(x => x === null);
    next < 0 ? pickSummary(it, verdicts, notes) : pick(it, next, verdicts, notes);
  };
  document.getElementById('skip').onclick = () => vote(false);
  document.getElementById('keep').onclick = () => vote(true);
  const c = document.getElementById('card'); let x0 = null, dx = 0;
  c.onpointerdown = e => { x0 = e.clientX; c.style.transition = 'none'; c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (x0 == null) return; dx = e.clientX - x0; c.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; };
  c.onpointerup = c.onpointercancel = () => { c.style.transition = ''; c.style.transform = ''; const v = dx > 90 ? true : dx < -90 ? false : null; x0 = null; dx = 0; if (v !== null) vote(v); };
}
function pickSummary(it, verdicts, notes) {
  const kept = verdicts.filter(Boolean).length;
  app.innerHTML = `${head(it, 'summary')}
  <div class="list">${it.options.map((o, j) => `<button class="item" onclick='pick(view, ${j}, ${JSON.stringify(verdicts)}, ${esc(JSON.stringify(notes))})'>
    <span class="pill" style="${verdicts[j] ? 'background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)' : 'background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)'}">${verdicts[j] ? 'keep' : 'skip'}</span>
    <b>${esc(o.label)}</b><span class="label">${esc(notes[j]) || 'no comment'}</span></button>`).join('')}</div>
  <p class="label">${kept > 1 ? 'The agent merges what you kept, using your notes.' : kept ? 'The agent builds this one, using your note.' : 'Nothing kept. The agent makes 3 new designs from your notes.'}</p>
  <button class="btn yes" id="send">${kept ? 'Send to agent' : 'Ask for new designs'}</button>`;
  document.getElementById('send').onclick = () => answer({ request: it.id.slice(4), verdicts, notes }, 'Sent to the agent');
}

// --- review: optional time markers on the video. State lives per request so going back keeps them.
const rstate = {};
const rs = it => rstate[it.id] ||= { markers: [], text: '' };
const shotAt = (it, t) => (it.shots || []).find(x => t >= x.at && t < x.at + x.dur)?.label || '';
function review(it) {
  const st = rs(it);
  app.innerHTML = `${head(it, esc(it.project || ''))}
  ${it.screenshot ? `<div class="shot"><img src="${fileUrl(it.screenshot)}" alt="Screenshot of ${esc(it.title)}"></div>` : ''}
  ${it.video ? `<div class="shot"><video id="rv" src="${fileUrl(it.video)}" controls playsinline preload="metadata" style="width:100%;display:block;max-height:65vh;background:#000"></video></div>
    ${owner() ? `<div class="row" style="align-items:center"><span class="label" id="now" style="flex:1;text-transform:none">0.0 s</span>
    <button class="btn ghost sm" onclick="rAdd()">+ Marker (M)</button></div><div class="list" id="mk"></div>` : ''}` : ''}
  ${it.tldr ? `<p style="font-size:1.15em;font-weight:600">${esc(it.tldr)}</p>` : ''}
  ${it.summary ? (it.tldr ? `<details><summary class="label">Details</summary><p>${esc(it.summary)}</p></details>` : `<p>${esc(it.summary)}</p>`) : ''}
  ${/^https?:\/\//.test(it.url || '') ? `<a class="btn ghost" style="text-align:center;text-decoration:none" href="${esc(it.url)}" target="_blank" rel="noopener">Open live ↗</a>` : ''}
  ${owner() ? `<label class="label" for="why">Note (what should change)</label><textarea id="why" oninput="rs(view).text=this.value">${esc(st.text)}</textarea>
  <div class="row"><button class="btn no" id="deny">Deny</button><button class="btn yes" id="ok">${esc(it.approve ? 'Approve: ' + it.approve : 'Approve → dev')}</button></div>` : ''}
  ${commentBox(it)}`;
  if (!owner()) return;
  const v = document.getElementById('rv');
  if (v) { v.ontimeupdate = () => { const sh = shotAt(it, v.currentTime); document.getElementById('now').textContent = v.currentTime.toFixed(1) + ' s' + (sh ? ' · ' + sh : ''); }; rList(); }
  const id = it.id.slice(4), body = approve => ({ request: id, approve, markers: st.markers, text: st.text });
  document.getElementById('ok').onclick = () => answer(body(true), it.approve ? 'Approved' : 'Approved, merging into dev');
  document.getElementById('deny').onclick = () => {
    if (!st.text.trim() && !st.markers.length) return toast('Add a marker or say what should change first.');
    answer(body(false), 'Sent back to the agent');
  };
}
function rList() {
  const it = view, st = rs(it), el = document.getElementById('mk'); if (!el) return;
  st.markers.sort((a, b) => a.in - b.in);
  el.innerHTML = st.markers.map((m, j) => { const sh = shotAt(it, m.in);
    return `<div class="item" style="cursor:default;gap:6px;box-sizing:border-box">
    <div class="row" style="align-items:center;gap:6px">
      <button class="chip" onclick="rSeek(${j})" aria-label="Springe zu ${m.in.toFixed(1)} s">▶ ${m.in.toFixed(1)}${m.out != null ? '–' + m.out.toFixed(1) : ''} s</button>
      <span class="label" style="flex:1;min-width:0;text-transform:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sh)}</span>
      <button class="btn ghost sm" onclick="rEnd(${j})">${m.out != null ? 'Ende neu' : 'Ende hier'}</button>
      <button class="btn no sm" onclick="rDel(${j})" aria-label="Marker löschen">×</button></div>
    <textarea style="min-height:44px" placeholder="Was stimmt hier nicht?" aria-label="Notiz zu ${m.in.toFixed(1)} s"
      oninput="rs(view).markers[${j}].note=this.value" onkeydown="event.stopPropagation()">${esc(m.note)}</textarea></div>`; }).join('');
}
const rNow = () => Math.round(document.getElementById('rv').currentTime * 10) / 10;
function rAdd() {
  const st = rs(view), m = { in: rNow(), out: null, note: '' }; st.markers.push(m); rList();
  document.querySelectorAll('#mk textarea')[st.markers.indexOf(m)]?.focus();
}
function rEnd(j) { const m = rs(view).markers[j], t = rNow(); t > m.in ? m.out = t : toast('Erst weiter abspielen, dann „Ende hier“.'); rList(); }
function rDel(j) { rs(view).markers.splice(j, 1); rList(); }
function rSeek(j) { const v = document.getElementById('rv'), m = rs(view).markers[j]; v.currentTime = m.in; v.play().catch(() => {}); }
document.addEventListener('keydown', e => {
  if ((e.key === 'm' || e.key === 'M') && view?.type === 'review' && document.getElementById('rv') && !/TEXTAREA|INPUT/.test(e.target.tagName)) { e.preventDefault(); rAdd(); }
});

// --- media: grid shot picker. State lives per request so the 5 s refresh never loses picks.
const mstate = {};
const ms = it => mstate[it.id] ||= { filter: 'all', picks: [], note: '' };
const pickOf = (it, label) => ms(it).picks.find(p => p.label === label);
const secs = x => x == null ? '' : x.toFixed(1) + ' s';
function media(it) {
  const st = ms(it), items = it.items || [];
  const shown = st.filter === 'video' ? items.filter(m => m.video) : st.filter === 'image' ? items.filter(m => !m.video) : items;
  const chip = (f, t) => `<button class="chip ${st.filter === f ? 'on' : ''}" onclick="ms(view).filter='${f}';media(view)">${t}</button>`;
  const tile = m => { const i = items.indexOf(m), n = st.picks.findIndex(p => p.label === m.label);
    const src = m.poster || m.image;
    return `<button class="tile ${n >= 0 ? 'on' : ''}" onclick="mediaDetail(view, ${i})" aria-label="${esc(m.label)}${n >= 0 ? ', gewählt Nummer ' + (n + 1) : ''}">
    ${src ? `<img src="${fileUrl(src)}" alt="" loading="lazy">` : '<span class="ph"></span>'}
    ${n >= 0 ? `<span class="num">${n + 1}</span>` : ''}${m.video ? `<span class="dur">▶ ${m.duration ? m.duration.toFixed(1) + ' s' : ''}</span>` : ''}
    <b>${esc(m.label)}</b><small>${esc(m.note || '')}</small></button>`; };
  const chosen = st.picks.map((p, j) => `<div class="item" style="cursor:default;flex-direction:row;align-items:center;gap:8px;box-sizing:border-box">
    <span class="num" style="position:static">${j + 1}</span>
    <button class="back" style="flex:1;min-width:0;text-align:left" onclick="mediaDetail(view, ${items.findIndex(m => m.label === p.label)})"><b>${esc(p.label)}</b>
      <span class="label" style="display:block;text-transform:none">${p.in != null || p.out != null ? `${secs(p.in ?? 0)} – ${p.out != null ? secs(p.out) : 'Ende'}` : items.find(m => m.label === p.label)?.video ? 'ganzer Clip' : 'Foto'}${p.note ? ' · ' + esc(p.note) : ''}</span></button>
    <button class="btn ghost sm" aria-label="hoch" onclick="mMove(${j},-1)" ${j ? '' : 'disabled'}>↑</button>
    <button class="btn ghost sm" aria-label="runter" onclick="mMove(${j},1)" ${j < st.picks.length - 1 ? '' : 'disabled'}>↓</button></div>`).join('');
  app.innerHTML = `${head(it, esc(it.project || ''))}
  ${it.tldr || it.summary ? `<p style="margin:0">${esc(it.tldr || it.summary)}</p>` : ''}
  <div class="chips">${chip('all', 'Alle')}${chip('video', 'Videos')}${chip('image', 'Fotos')}${chip('picked', `Gewählt (${st.picks.length})`)}</div>
  ${st.filter === 'picked' ? (chosen ? `<div class="list">${chosen}</div>` : '<p class="empty">Noch nichts gewählt.</p>') : `<div class="grid">${shown.map(tile).join('')}</div>`}
  ${owner() ? `<label class="label" for="mnote">Notiz an den Agenten</label><textarea id="mnote" oninput="ms(view).note=this.value">${esc(st.note)}</textarea>
  <button class="btn yes" onclick="mSend()">Senden (${st.picks.length} gewählt)</button>` : ''}
  ${commentBox(it)}`;
}
function mMove(j, d) { const p = ms(view).picks; [p[j], p[j + d]] = [p[j + d], p[j]]; media(view); }
function mToggle(i) {
  const st = ms(view), m = view.items[i], k = st.picks.findIndex(p => p.label === m.label);
  k >= 0 ? st.picks.splice(k, 1) : st.picks.push({ label: m.label, in: null, out: null, note: '' });
  mediaDetail(view, i);
}
function mMark(i, key) { // takes the playhead; picks the clip if not yet picked
  const v = document.getElementById('mv'), m = view.items[i];
  let p = pickOf(view, m.label); if (!p) ms(view).picks.push(p = { label: m.label, in: null, out: null, note: '' });
  p[key] = Math.round(v.currentTime * 10) / 10;
  const t = v.currentTime; mediaDetail(view, i); document.getElementById('mv').currentTime = t;
}
function mWhole(i) { const p = pickOf(view, view.items[i].label); if (p) { p.in = p.out = null; } mediaDetail(view, i); }
function mediaDetail(it, i) {
  const m = it.items[i], p = pickOf(it, m.label), n = ms(it).picks.indexOf(p), last = it.items.length - 1;
  app.innerHTML = `<header><button class="back" onclick="media(view)">← Alle Shots</button><span>${i + 1} / ${last + 1}</span></header>
  <h2>${esc(m.label)}${n >= 0 ? ` <span class="pill">Nr. ${n + 1}</span>` : ''}</h2>
  ${m.note ? `<p style="margin:0">${esc(m.note)}</p>` : ''}
  <div class="shot">${m.video ? `<video id="mv" src="${fileUrl(m.video)}" ${m.poster ? `poster="${fileUrl(m.poster)}"` : ''} controls playsinline preload="metadata" style="width:100%;display:block;max-height:60vh;background:#000"></video>`
    : `<img src="${fileUrl(m.image)}" alt="${esc(m.label)}">`}</div>
  ${owner() ? `<button class="btn ${p ? 'yes' : 'ghost'}" onclick="mToggle(${i})">${p ? '✓ Genommen (tippen zum Entfernen)' : 'Nehmen'}</button>
  ${m.video ? `<div class="row"><button class="btn ghost" onclick="mMark(${i},'in')">Start hier${p?.in != null ? ': ' + secs(p.in) : ''}</button>
    <button class="btn ghost" onclick="mMark(${i},'out')">Ende hier${p?.out != null ? ': ' + secs(p.out) : ''}</button></div>
    ${p && (p.in != null || p.out != null) ? `<button class="btn ghost" onclick="mWhole(${i})">Ganzer Clip</button>` : ''}` : ''}
  ${p ? `<label class="label" for="pn">Notiz zu ${esc(m.label)}</label><textarea id="pn" style="min-height:50px" oninput="pickOf(view,view.items[${i}].label).note=this.value">${esc(p.note)}</textarea>` : ''}` : ''}
  <div class="row"><button class="btn ghost" onclick="mediaDetail(view, ${i - 1})" ${i ? '' : 'disabled'}>← Vorheriger</button>
    <button class="btn ghost" onclick="mediaDetail(view, ${i + 1})" ${i < last ? '' : 'disabled'}>Nächster →</button></div>`;
}
function mSend() {
  const st = ms(view);
  if (!st.picks.length && !st.note.trim()) return toast('Wähle etwas oder schreib eine Notiz.');
  answer({ request: view.id.slice(4), picks: st.picks, note: st.note }, 'An den Agenten gesendet');
}

load(); timer = setInterval(load, 5000);
</script>
</body>
